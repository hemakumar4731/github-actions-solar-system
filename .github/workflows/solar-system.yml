name: Solar System Workflow
env:
  MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}


on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        container:
          image: node:20
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        # - name: Setup NodeJS Version
        #   uses: actions/setup-node@v4
        #   with:
        #     node-version: 20

        - name: cache npm dependencies
          uses: actions/cache@v4
          with:
            key: ${{ runner.os }}-node-modules-${{ hashfiles('package-lock.json')}}
            path: ~/.npm
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
            

    code-coverage:
        name: code-coverage
        runs-on: ubuntu-latest
        steps:
        - name: checkout repo
          uses: actions/checkout@v4
        
        - name: setup nodejs
          uses: actions/setup-node@v4
          with:
            version: 18
        
        - name: install dependencies
          run: npm install
          continue-on-error: true

        - name: run coverage
          run: npm code-coverage
          continue-on-error: true

        - name: download artifact
          uses: actions/upload-artifact@v4
          with:
            name: code coverage result
            path: coverage
            retention-days: 5 

    docker:
        name: docker 
        runs-on: ubuntu-latest
        needs: [unit-testing, code-coverage]
        permissions:
          packages: write
        steps: 
        - name: Checkout repo
          uses: actions/checkout@v4
        - name: Docker login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            Username: ${{ github.actor }}
            Password: ${{ secrets.GITHUB_TOKEN }}
        - name: Docker build
          uses: docker/build-push-action@v4
          with:
            push: true
            tags: ghcr.io/${{ github.actor }}/solar-system:${{ github.sha }}

    dev-deploy:
      name: dev-deploy
      runs-on: ubuntu-latest
      needs:
        - docker
      environment:
        name: development
      steps:
        - name: install kuberntes
          uses: helm/kind-action@v1
        -  run: |
            sleep 60
            kubectl -n kube-system get pod
            set +e
            REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
            kubectl run solar --image ghcr.io/${REPO_OWNER_LC}/solar-system:${{ github.sha }} \
              --env MONGO_URI=${{ env.MONGO_URI}} \
              --env MONGO_USERNAME=${{ env.MONGO_USERNAME}} \
              --env MONGO_PASSWORD=${{ env.MONGO_PASSWORD}}
            set -e
            echo "kubectl returned $?"
            kubectl -n default get pod
            sleep 10


